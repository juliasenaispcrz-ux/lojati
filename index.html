<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Cadastro dos Cliente</title>
</head>
<body>

  <h2>Cadastrar o Cliente</h2>

  <form id="formCliente">
    <input type="text" id="nome" placeholder="Nome" required><br><br>
    <input type="email" id="email" placeholder="E-mail" required><br><br>
    <input type="text" id="numero" placeholder="Telefone" required><br><br>
    <input type="text" id="endereco" placeholder="Endereço" required><br><br>
    
    <button type="submit">Salvar</button>
  </form>

</body>
</html>
